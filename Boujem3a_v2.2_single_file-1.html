function tr(lang, key, vars={}) {
  let v = t[lang]?.[key] ?? t.en[key] ?? key;
  if (typeof v === 'string') {
    Object.entries(vars).forEach(([k,val]) => v = v.replaceAll(`{${k}}`, String(val)));
  }
  return v;
}

function detectLanguage(text, current='de', locked=false) {
  const s = text.trim().toLowerCase();
  if (/continue in english|speak english|in english/.test(s)) return {lang:'en', explicit:true};
  if (/weiter auf deutsch|auf deutsch|sprechen wir deutsch/.test(s)) return {lang:'de', explicit:true};
  if (/continuer en français|en français|parler français/.test(s)) return {lang:'fr', explicit:true};
  if (/continuiamo in italiano|in italiano|parlare italiano/.test(s)) return {lang:'it', explicit:true};
  if (locked) return {lang:current, explicit:false};
  if (s.length < 5 || /^(ok|okay|ja|oui|si|sì|no|non|ciao|hi|hey)$/.test(s)) return {lang:current, explicit:false};
  const words = s.replace(/[^\p{L}0-9+ ]/gu,' ').split(/\s+/).filter(Boolean);
  const scores = {de:0,fr:0,it:0,en:0};
  for (const [lang,hints] of Object.entries(LANG_HINTS)) {
    for (const w of words) if (hints.includes(w)) scores[lang]++;
  }
  const ranked = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return ranked[0][1] >= 2 && ranked[0][1] > ranked[1][1] ? {lang:ranked[0][0], explicit:false} : {lang:current, explicit:false};
}

function isGreeting(s){ return /^(hi|hello|hey|grüezi|gruezi|hallo|bonjour|salut|buongiorno|ciao)[!. ]*$/i.test(s.trim()); }
function isThanks(s){ return /^(thanks|thank you|danke|merci|grazie|thx)[!. ]*$/i.test(s.trim()); }
function isGoodbye(s){ return /^(bye|goodbye|tschüss|tschuess|auf wiedersehen|au revoir|ciao|arrivederci)[!. ]*$/i.test(s.trim()); }
function isAnnoyed(s){ return /(already told|i told you|schon gesagt|bereits gesagt|je l'ai déjà dit|je l’ai déjà dit|te l'ho già detto|te l’ho già detto|why.*again|warum.*nochmal|encore\s*\?|di nuovo\s*\?)/i.test(s); }
function isAffirmative(s){ return /^(yes|yes that's right|yes thats right|ja|ja stimmt|stimmt|oui|oui c'est correct|si|sì|corretto|correct|ok|okay)$/i.test(s.trim()); }
function isBookingTrap(s){ return /(booked|confirmed|gebucht|bestätigt|bestaetigt|réservé|reserve|confirmé|confermato|prenotato)/i.test(s) && /(thursday|friday|monday|tuesday|wednesday|saturday|sunday|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica|\d{1,2}[:.]\d{2})/i.test(s); }

function validPhone(phone) {
  const digits = phone.replace(/\D/g,'');
  return digits.length >= 8 && digits.length <= 15;
}

function addWorkItems(state, text) {
  const found = [];
  for (const item of WORK_MAP) if (item.re.test(text)) found.push(item.cat);
  if (found.length) {
    for (const cat of found) {
      if (!state.workItems.some(x=>x.category===cat)) state.workItems.push({category:cat, description:text.trim()});
    }
  }
  return found.length>0;
}

function extractPhone(text) {
  const matches = text.match(/(?:\+\d{1,3}[\s().-]*)?(?:\d[\s().-]*){7,14}\d/g);
  if (!matches) return '';
  const cand = matches.map(x=>x.trim()).sort((a,b)=>b.length-a.length)[0];
  return validPhone(cand) ? cand : '';
}

function extractYear(text) {
  const years = [...text.matchAll(/\b(19\d{2}|20\d{2})\b/g)].map(m=>m[1]);
  return years.length ? years[years.length-1] : '';
}

function detectUnknownYear(text) { return /(not sure|don't know|do not know|weiss nicht|weiß nicht|nicht sicher|je ne sais pas|pas sûr|pas sure|non lo so|non sono sicuro|non sono sicura)/i.test(text); }

function extractName(text) {
  const patterns = [
    /(?:you can use|use|my name is|i am|i'm)\s+([\p{L}'-]{2,30})(?:\s+([\p{L}'-]{2,30}))?/iu,
    /(?:ich heisse|ich heiße|mein name ist|verwenden sie|nimm|nehmen sie)\s+([\p{L}'-]{2,30})(?:\s+([\p{L}'-]{2,30}))?/iu,
    /(?:je m'appelle|je m’appelle|mon nom est|vous pouvez utiliser)\s+([\p{L}'-]{2,30})(?:\s+([\p{L}'-]{2,30}))?/iu,
    /(?:mi chiamo|il mio nome è|il mio nome e|può usare|puo usare)\s+([\p{L}'-]{2,30})(?:\s+([\p{L}'-]{2,30}))?/iu,
  ];
  for (const re of patterns) {
    const m = text.match(re);
    if (m) return [m[1],m[2]].filter(Boolean).join(' ').replace(/[.,!?]+$/,'');
  }
  return '';
}

function extractVehicle(text, state) {
  let changed = false;
  const commonMakes = ['Volkswagen','VW','Audi','BMW','Mercedes','Toyota','Honda','Ford','Opel','Renault','Peugeot','Citroen','Citroën','Fiat','Skoda','Škoda','Seat','Tesla','Volvo','Mazda','Nissan','Hyundai','Kia','Dacia','Porsche','Mini'];
  for (const make of commonMakes) {
    const re = new RegExp(`\\b${make.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')}\\b`,'i');
    if (re.test(text) && !state.vehicle.make) { state.vehicle.make = make === 'VW' ? 'Volkswagen' : make; changed = true; break; }
  }
  const modelPatterns = [
    /\b(Golf\s*[1-8]?)\b/i,/\b(Polo)\b/i,/\b(Passat)\b/i,/\b(Tiguan)\b/i,/\b(Touran)\b/i,/\b(A[1-8]|Q[2-8]|RS\d|S\d)\b/i,
    /\b(3(?:er)?|5(?:er)?|X[1-7]|M[2-8])\b/i,/\b(C[- ]?Klasse|E[- ]?Klasse|A[- ]?Klasse|GLA|GLC|GLE)\b/i,/\b(Model\s*[3YSX])\b/i,
    /\b(Corsa|Astra|Clio|Megane|Mégane|208|308|500|Octavia|Fabia|Leon|Ibiza|Yaris|Corolla|Civic|Focus|Fiesta)\b/i
  ];
  for (const re of modelPatterns) {
    const m = text.match(re); if (m) { state.vehicle.model = m[1]; changed = true; break; }
  }
  return changed;
}

function extractPreferredTime(text) {
  const day = text.match(/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lunedì|lunedi|martedì|martedi|mercoledì|mercoledi|giovedì|giovedi|venerdì|venerdi|sabato|domenica)\b/i);
  const time = text.match(/\b([01]?\d|2[0-3])[:.]([0-5]\d)\b/);
  const relative = text.match(/\b(today|tomorrow|heute|morgen|aujourd'hui|demain|oggi|domani|morning|afternoon|evening|vormittag|nachmittag|abend|matin|après-midi|apres-midi|soir|mattina|pomeriggio|sera)\b/i);
  if (day || time || relative) return [day?.[0], relative?.[0], time?.[0]].filter(Boolean).join(' ');
  return '';
}

function correctionPair(text) {
  const patterns = [
    /\b(19\d{2}|20\d{2})\b\s*[,;:-]?\s*(?:not|instead of)\s*\b(19\d{2}|20\d{2})\b/i,
    /\b(19\d{2}|20\d{2})\b\s*[,;:-]?\s*(?:nicht)\s*\b(19\d{2}|20\d{2})\b/i,
    /\b(19\d{2}|20\d{2})\b\s*[,;:-]?\s*(?:pas)\s*\b(19\d{2}|20\d{2})\b/i,
    /\b(19\d{2}|20\d{2})\b\s*[,;:-]?\s*(?:non)\s*\b(19\d{2}|20\d{2})\b/i,
  ];
  for (const re of patterns) { const m=text.match(re); if(m) return {newValue:m[1], oldValue:m[2]}; }
  const notThen = text.match(/(?:not|nicht|pas|non)\s*\b(19\d{2}|20\d{2})\b.*?\b(19\d{2}|20\d{2})\b/i);
  if (notThen) return {oldValue:notThen[1], newValue:notThen[2]};
  const meant = text.match(/(?:i meant|ich meinte|je voulais dire|intendevo)\s*\b(19\d{2}|20\d{2})\b/i);
  if (meant) return {newValue:meant[1], oldValue:''};
  return null;
}

function extractFacts(state, text) {
  const events = [];
  const yearCorr = correctionPair(text);
  if (yearCorr) {
    const prev = state.vehicle.year;
    state.vehicle.year = yearCorr.newValue;
    state.correctionHistory.push({field:'vehicle.year', previousValue:prev || yearCorr.oldValue, newValue:yearCorr.newValue});
    events.push('correction');
  } else {
    const y = extractYear(text);
    if (y && !state.vehicle.year) state.vehicle.year = y;
    if (detectUnknownYear(text) && !state.vehicle.year) state.vehicle.year = 'unknown';
  }

  addWorkItems(state, text);
  extractVehicle(text, state);
  const ph = extractPhone(text); if (ph) { state.customer.phone = ph; state.phoneValidation = validPhone(ph) ? 'valid' : 'invalid'; }
  const nm = extractName(text); if (nm) state.customer.name = nm;
  const pt = extractPreferredTime(text); if (pt) state.preferredTime = pt;

  // Generic model capture when asked and no model exists: short alphanumeric vehicle-looking answer.
  if (!state.vehicle.model) {
    const m = text.trim().match(/^([A-Za-zÀ-ÿ]{2,15}\s?[-]?[A-Za-z0-9]{0,8}(?:\s\d)?)$/);
    if (m && !/^(yes|no|ja|nein|oui|non|si|sì|ok|okay|thanks|danke|merci|grazie)$/i.test(m[1])) state.vehicle.model = m[1];
  }

  return events;
}

function nextMissing(state) {
  if (!state.workItems.length) return 'work';
  if (!state.vehicle.model && !state.vehicle.make) return 'vehicle';
  if (!state.vehicle.year) return 'year';
  if (!state.customer.name) return 'name';
  if (!state.customer.phone) return 'phone';
  if (!state.preferredTime) return 'time';
  return null;
}

function complexityOf(text) {
  const len = text.trim().length;
  const facts = [WORK_MAP.some(x=>x.re.test(text)), /\b(19\d{2}|20\d{2})\b/.test(text), /\+?\d[\d\s().-]{7,}/.test(text), /\b(thursday|friday|donnerstag|freitag|jeudi|vendredi|giovedì|venerdì|giovedi|venerdi)\b/i.test(text)].filter(Boolean).length;
  if (len < 15 && facts === 0) return 'tiny';
  if (len > 100 || facts >= 3 || /not|nicht|pas|non|meant|meinte|voulais dire|intendevo/i.test(text)) return 'complex';
  return 'normal';
}

function buildOwnerSummary(state, labels) {
  const works = state.workItems.map(x=>x.category).join(', ') || labels.notProvided;
  const vehicle = [state.vehicle.make,state.vehicle.model].filter(Boolean).join(' ') || labels.notProvided;
  const year = state.vehicle.year === 'unknown' ? labels.unknown : (state.vehicle.year || labels.notProvided);
  const phoneNote = state.phoneValidation === 'valid' ? labels.phoneValid : (state.customer.phone ? labels.phoneInvalid : '');
  return [
    `${labels.requestedWork}: ${works}`,
    `${labels.vehicle}: ${vehicle}`,
    `${labels.year}: ${year}`,
    `${labels.customer}: ${state.customer.name || labels.notProvided}`,
    `${labels.phone}: ${state.customer.phone || labels.notProvided}`,
    `${labels.preferredTime}: ${state.preferredTime || labels.notProvided}`,
    `${labels.language}: ${state.language.toUpperCase()}`,
    phoneNote ? `${labels.validation}: ${phoneNote}` : '',
    `Status: ${state.finalized ? 'Prepared (demo)' : state.ownerStatus}`,
  ].filter(Boolean).join('\n');
}


const $ = id => document.getElementById(id);
const storeKey = 'boujem3a-v22-state';
let state = loadState();
let pendingTexts = [];
let burstTimer = null;
let responseToken = 0;
let processing = false;
let reviewShown = false;

function loadState(){ try { const x=JSON.parse(localStorage.getItem(storeKey)); return x || blankState(businessConfig.languages.default); } catch { return blankState(businessConfig.languages.default); } }
function save(){ localStorage.setItem(storeKey, JSON.stringify(state)); }
function rand([a,b]){ return Math.round(a + Math.random()*(b-a)); }
function pick(arr,intent){ const last=state.lastPromptByIntent?.[intent]; let choices=arr.map((_,i)=>i).filter(i=>i!==last); if(!choices.length) choices=arr.map((_,i)=>i); const idx=choices[Math.floor(Math.random()*choices.length)]; state.lastPromptByIntent ||= {}; state.lastPromptByIntent[intent]=idx; return arr[idx]; }
function fmtName(s){return s ? s.replace(/\b\w/g,c=>c.toUpperCase()) : s;}
function localized(key,vars={}){return tr(state.language,key,vars)}
function append(role,text,extra=''){
  const div=document.createElement('div'); div.className=`msg ${role} ${extra}`; div.textContent=text; $('chatBody').appendChild(div); $('chatBody').scrollTop=$('chatBody').scrollHeight;
  if(role==='user'||role==='assistant') state.rawMessages.push({role:role==='user'?'customer':'assistant',text});
  save(); renderOwner();
}
function showReview(){
  const labels = t[state.language];
  const works=state.workItems.map(x=>x.category).join(', ');
  const vehicle=[state.vehicle.make,state.vehicle.model].filter(Boolean).join(' ');
  const year=state.vehicle.year==='unknown'?labels.unknown:state.vehicle.year;
  const wrap=document.createElement('div'); wrap.className='msg assistant reviewCard';
  wrap.innerHTML=`<strong>${labels.reviewTitle}</strong><div>${labels.requestedWork}: ${esc(works)}</div><div>${labels.vehicle}: ${esc(vehicle)}</div><div>${labels.year}: ${esc(year)}</div><div>${labels.customer}: ${esc(state.customer.name)}</div><div>${labels.phone}: ${esc(state.customer.phone)}</div><div>${labels.preferredTime}: ${esc(state.preferredTime)}</div><div style="margin-top:7px">${labels.reviewAsk}</div>`;
  $('chatBody').appendChild(wrap); $('chatBody').scrollTop=$('chatBody').scrollHeight; reviewShown=true;
}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function renderStatic(){
  const L=t[state.language];
  document.documentElement.lang=state.language;
  $('brandName').textContent=`${businessConfig.business.name} · ${businessConfig.receptionist.displayName}`;
  $('brandSub').textContent='Garage AI Receptionist Demo'; $('testBadge').textContent=L.testMode; $('versionBadge').textContent=L.staging;
  $('chatTitle').textContent=businessConfig.receptionist.displayName; $('chatSub').textContent=`${businessConfig.business.name} · ${L.testMode}`;
  $('input').placeholder=L.placeholder; $('send').textContent=L.send; $('reset').textContent=L.newDemo; $('ownerTitle').textContent=`${L.owner} · ${L.liveDraft}`; $('ownerSub').textContent=L.demoWarn;
  $('statusLabel').textContent=L.status; $('copy').textContent=L.copy; $('toggleRaw').textContent=L.raw; $('footer').textContent=L.demoWarn; $('typingText').textContent=tr(state.language,'typing',{name:businessConfig.receptionist.displayName});
  $('langSelect').value=state.language;
}

function renderOwner(){
  const L=t[state.language];
  const items=[
    [L.requestedWork,state.workItems.map(x=>x.category).join(', ')],
    [L.vehicle,[state.vehicle.make,state.vehicle.model].filter(Boolean).join(' ')],
    [L.year,state.vehicle.year==='unknown'?L.unknown:state.vehicle.year],
    [L.customer,state.customer.name], [L.phone,state.customer.phone], [L.preferredTime,state.preferredTime], [L.language,L.localeName],
    [L.validation,state.customer.phone ? (validPhone(state.customer.phone)?L.phoneValid:L.phoneInvalid) : '']
  ];
  $('ownerFields').innerHTML=items.map(([k,v])=>`<div class="field"><div class="label">${esc(k)}</div><div class="value ${v?'':'empty'}">${esc(v||L.notProvided)}</div></div>`).join('');
  $('status').value=state.ownerStatus || 'New request';
  $('raw').innerHTML=state.rawMessages.map(m=>`<div><strong>${m.role==='customer'?'Customer':businessConfig.receptionist.displayName}:</strong> ${esc(m.text)}</div>`).join('');
  save();
}

function promptFor(intent){ const L=t[state.language]; const key={work:'askWork',vehicle:'askVehicle',year:'askYear',name:'askName',phone:'askPhone',time:'askTime'}[intent]; return pick(L[key],intent); }
function replyDelay(text){ const c=complexityOf(text); return Math.min(rand(businessConfig.pacing[c]), businessConfig.pacing.hardCap); }
async function humanReply(text, sourceText=''){
  const myToken=++responseToken; const total=replyDelay(sourceText||text); const typingStart=Math.min(rand(businessConfig.pacing.typingStart),Math.max(250,total-150));
  await sleep(typingStart); if(myToken!==responseToken)return; $('typing').hidden=false;
  await sleep(Math.max(0,total-typingStart)); if(myToken!==responseToken)return; $('typing').hidden=true; append('assistant',text);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function shouldAskPhoneAgain(){ return !state.customer.phone || !validPhone(state.customer.phone); }
function nextIntent(){ const n=nextMissing(state); if(n==='phone' && state.customer.phone && !validPhone(state.customer.phone)) return 'phone'; return n; }

async function processBatch(texts){
  processing=true; const combined=texts.join('\n');
  const langResult=detectLanguage(combined,state.language,state.languageLocked); if(langResult.lang!==state.language){ state.language=langResult.lang; if(langResult.explicit) state.languageLocked=true; renderStatic(); renderOwner(); }
  for(const tx of texts) append('user',tx);
  const last=texts[texts.length-1].trim();
  if(langResult.explicit && texts.length===1 && !extractive(last)) { await humanReply(pick(t[state.language].greet,'langSwitch'),combined); processing=false; return; }
  if(isBookingTrap(combined) && !businessConfig.scheduling.liveAvailabilityEnabled){ await humanReply(t[state.language].appointmentBoundary,combined); processing=false; return; }
  if(isGreeting(last) && texts.length===1){ await humanReply(pick(t[state.language].greet,'greet'),last); processing=false; return; }
  if(isThanks(last) && texts.length===1){ await humanReply(pick(t[state.language].thanks,'thanks'),last); processing=false; return; }
  if(isGoodbye(last) && texts.length===1){ await humanReply(pick(t[state.language].goodbye,'bye'),last); processing=false; return; }

  const annoyed=isAnnoyed(combined); const events=[]; for(const tx of texts) events.push(...extractFacts(state,tx));
  state.customer.name=fmtName(state.customer.name); if(state.customer.phone) state.phoneValidation=validPhone(state.customer.phone)?'valid':'invalid'; save(); renderOwner();

  if(state.finalized){ await humanReply(annoyed?pick(t[state.language].annoyed,'annoyed'):pick(t[state.language].thanks,'afterFinal'),combined); processing=false; return; }
  if(isAffirmative(last) && nextMissing(state)===null && reviewShown){ state.finalized=true; state.ownerStatus='Needs review'; save(); renderOwner(); await humanReply(t[state.language].finalThanks,combined); processing=false; return; }

  const miss=nextIntent(); let reply='';
  if(events.includes('correction')) reply += t[state.language].correction + ' ';
  if(annoyed) reply = pick(t[state.language].annoyed,'annoyed') + ' ' + reply;
  if(miss){ reply += promptFor(miss); reviewShown=false; await humanReply(reply.trim(),combined); }
  else { if(reply.trim()) await humanReply(reply.trim(),combined); await sleep(100); showReview(); }
  processing=false;
}

function extractive(s){return /(oil|service|öl|brake|brems|frein|freni|tire|reifen|pneu|gomme|\d{4}|\+?\d[\d\s().-]{7,}|golf|audi|bmw|mercedes|toyota|honda|ford|opel|renault|peugeot|tesla)/i.test(s)}
function queueMessage(text){
  if(!text.trim())return; pendingTexts.push(text.trim()); $('input').value=''; responseToken++; $('typing').hidden=true;
  clearTimeout(burstTimer); const delay=rand(businessConfig.pacing.burstDebounce); burstTimer=setTimeout(()=>{ const batch=[...pendingTexts]; pendingTexts=[]; processBatch(batch); },delay);
}

function resetDemo(){
  responseToken++; clearTimeout(burstTimer); pendingTexts=[]; state=blankState(businessConfig.languages.default); reviewShown=false; localStorage.removeItem(storeKey); $('chatBody').innerHTML=''; $('typing').hidden=true; renderStatic(); renderOwner(); append('assistant',tr(state.language,'welcome',{name:businessConfig.receptionist.displayName}));
}

const scenarios={
  'de-normal':['Grüezi','Ich brauche einen Ölwechsel für meinen Golf 5, Baujahr 2018.','Mein Name ist Test Meier, +41 79 000 11 22. Donnerstag 14:00 wäre gut.'],
  'en-annoyed':['Hi, I need my brakes checked on a Golf 5.','It is a 2020 model.','My name is Test Hiba and you can use +41 79 000 11 22.','I already told you the model! Friday afternoon works.'],
  'fr-correction':['Bonjour, vidange et freins pour ma Golf 5.','Elle est de 2020.','Pardon, 2024, pas 2020.','Je m’appelle Test Hiba, +41 79 000 11 22. Jeudi 14:00.'],
  'it-multi':['Buongiorno, devo fare tagliando, freni e gomme sulla Golf 5 del 2019.','Mi chiamo Test Luca, +41 79 000 11 22.','Venerdì pomeriggio andrebbe bene.']
};
async function loadScenario(){ const key=$('scenario').value; if(!key)return; resetDemo(); for(const msg of scenarios[key]){ queueMessage(msg); await sleep(900); } }

$('send').addEventListener('click',()=>queueMessage($('input').value));
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();queueMessage($('input').value)}});
$('reset').addEventListener('click',resetDemo);
$('runScenario').addEventListener('click',loadScenario);
$('langSelect').addEventListener('change',e=>{state.language=e.target.value; state.languageLocked=true; save(); renderStatic(); renderOwner();});
$('status').addEventListener('change',e=>{state.ownerStatus=e.target.value; save();});
$('toggleRaw').addEventListener('click',()=>$('raw').classList.toggle('open'));
$('copy').addEventListener('click',async()=>{ const L=t[state.language]; await navigator.clipboard.writeText(buildOwnerSummary(state,L)); const old=$('copy').textContent; $('copy').textContent=L.copied; setTimeout(()=>$('copy').textContent=old,1200); });

renderStatic(); renderOwner(); if(!state.rawMessages.length) append('assistant',tr(state.language,'welcome',{name:businessConfig.receptionist.displayName})); else { for(const m of state.rawMessages){ const div=document.createElement('div'); div.className=`msg ${m.role==='customer'?'user':'assistant'}`; div.textContent=m.text; $('chatBody').appendChild(div);} }
</script></body></html>
